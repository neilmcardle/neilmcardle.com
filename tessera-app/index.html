<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tessera/logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0d0c" />
    <title>Tessera</title>
    <link
      rel="preload"
      href="/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: Inter;
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/inter-latin.woff2") format("woff2");
      }
      :root {
        --font-inter: Inter;
        color-scheme: dark;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0d0d0c;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
