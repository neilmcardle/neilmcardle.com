    <script>
      (() => {
        const fig = document.getElementById("fig");
        if (!fig) return;
        const wrap = document.createElement("div");
        wrap.className = "zwrap";
        fig.parentNode.insertBefore(wrap, fig);
        wrap.appendChild(fig);
        const chip = document.createElement("div");
        chip.className = "zchip";
        chip.innerHTML =
          '<button class="zm" aria-label="Zoom out">−</button><button class="zp" aria-label="Reset zoom">100%</button><button class="zi" aria-label="Zoom in">+</button>';
        wrap.appendChild(chip);
        let s = 1,
          tx = 0,
          ty = 0;
        const box = () => ({ w: fig.clientWidth, h: fig.clientHeight });
        const apply = () => {
          const { w, h } = box();
          s = Math.min(5, Math.max(1, s));
          if (s <= 1.001) {
            s = 1;
            tx = ty = 0;
          } else {
            tx = Math.min(0, Math.max(w - w * s, tx));
            ty = Math.min(0, Math.max(h - h * s, ty));
          }
          fig.style.transform =
            s === 1 ? "" : `translate(${tx}px,${ty}px) scale(${s})`;
          wrap.classList.toggle("on", s > 1);
          document.documentElement.classList.toggle(
            "zoomed",
            s > 1,
          ); /* desktop: nothing is cut off, the page just does not scroll while zoomed */
          chip.querySelector(".zp").textContent = Math.round(s * 100) + "%";
          grain();
        };
        // the paper grain is noise in drawing units: zoomed, it would blow up into blotches, so its frequency rises with the
        // zoom and it stays the same fine grain on screen (the filter is rebuilt on resize, so this re-applies then too)
        const grain = () => {
          const fl = document.getElementById("hand");
          if (!fl) return;
          const ts = [...fl.querySelectorAll("feTurbulence")];
          if (!ts.length) return;
          const g =
            ts.find((t) => t.getAttribute("result") === "n1") ||
            ts.reduce((a, b) =>
              parseFloat(b.getAttribute("baseFrequency")) >
              parseFloat(a.getAttribute("baseFrequency"))
                ? b
                : a,
            );
          if (!g.dataset.f0) g.dataset.f0 = g.getAttribute("baseFrequency");
          const v = (parseFloat(g.dataset.f0) * s).toFixed(4);
          if (g.getAttribute("baseFrequency") !== v)
            g.setAttribute("baseFrequency", v);
        };
        const fd = document.getElementById("fdefs");
        if (fd)
          new MutationObserver(() => grain()).observe(fd, {
            childList: true,
            subtree: true,
          });
        const zoomAt = (k, px, py) => {
          const s2 = Math.min(5, Math.max(1, s * k));
          tx = px - ((px - tx) * s2) / s;
          ty = py - ((py - ty) * s2) / s;
          s = s2;
          apply();
        };
        const local = (e) => {
          const r = wrap.getBoundingClientRect();
          return [e.clientX - r.left, e.clientY - r.top];
        };
        wrap.addEventListener(
          "wheel",
          (e) => {
            if (e.ctrlKey || e.metaKey) {
              e.preventDefault();
              const [x, y] = local(e);
              zoomAt(
                Math.exp(-Math.max(-50, Math.min(50, e.deltaY)) * 0.006),
                x,
                y,
              ); /* a wheel notch ~1.35x, a pinch stays smooth */
            } else if (s > 1) {
              e.preventDefault();
              tx -= e.deltaX;
              ty -= e.deltaY;
              apply();
            }
          },
          { passive: false },
        );
        const center = () => {
          const { w, h } = box();
          return [w / 2, h / 2];
        };
        chip.querySelector(".zi").onclick = () => zoomAt(1.5, ...center());
        chip.querySelector(".zm").onclick = () => zoomAt(1 / 1.5, ...center());
        chip.querySelector(".zp").onclick = () => {
          s = 1;
          apply();
        };
        chip.addEventListener("pointerdown", (e) => e.stopPropagation());
        // two fingers: pinch to zoom and move to pan; the figure's own one-finger turn waits while they are down
        const pts = new Map();
        let pinch = null;
        const two = () => {
          const [a, b] = [...pts.values()];
          return {
            d: Math.hypot(a.x - b.x, a.y - b.y),
            x: (a.x + b.x) / 2,
            y: (a.y + b.y) / 2,
          };
        };
        wrap.addEventListener(
          "pointerdown",
          (e) => {
            if (e.pointerType !== "touch") return;
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pts.size === 2) {
              pinch = two();
              e.stopPropagation();
            }
          },
          true,
        );
        wrap.addEventListener(
          "pointermove",
          (e) => {
            if (!pts.has(e.pointerId)) return;
            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pinch && pts.size === 2) {
              e.stopPropagation();
              e.preventDefault();
              const n = two(),
                r = wrap.getBoundingClientRect();
              tx += n.x - pinch.x;
              ty += n.y - pinch.y;
              zoomAt(n.d / pinch.d, n.x - r.left, n.y - r.top);
              pinch = n;
            }
          },
          true,
        );
        const up = (e) => {
          pts.delete(e.pointerId);
          if (pts.size < 2) pinch = null;
        };
        wrap.addEventListener("pointerup", up, true);
        wrap.addEventListener("pointercancel", up, true);
        addEventListener("resize", apply);
      })();
    </script>
    <style>
      .toast {
        position: absolute !important;
        left: 50% !important;
        right: auto !important;
        top: 6% !important;
        bottom: auto !important;
        z-index: 4 !important;
        transform: translate(-50%, 8px) !important;
        opacity: 0 !important;
        pointer-events: none !important;
        display: flex !important;
        align-items: center;
        gap: 8px;
        width: max-content;
        max-width: min(86%, 440px);
        white-space: normal !important;
        font:
          600 12.5px/1.35 ui-monospace,
          Menlo,
          monospace !important;
        letter-spacing: 0.01em !important;
        text-transform: none !important;
        color: #231e16 !important;
        background: #fff1bf !important;
        border: 1px solid rgba(35, 30, 22, 0.28) !important;
        border-radius: 8px !important;
        box-shadow: 0 8px 22px rgba(35, 30, 22, 0.16) !important;
        padding: 7px 13px 7px 9px !important;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease !important;
      }
      .toast::before {
        content: "!";
        flex: none;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #231e16;
        color: #fff1bf;
        font:
          800 11px/17px ui-monospace,
          Menlo,
          monospace;
        text-align: center;
      }
      .toast.show {
        opacity: 1 !important;
        transform: translate(-50%, 0) !important;
      }
    </style>
    <script>
      (() => {
        const cap = () => {
          const t = document.getElementById("toast");
          if (!t) return;
          const s = t.textContent;
          if (s && s[0] !== s[0].toUpperCase())
            t.textContent = s[0].toUpperCase() + s.slice(1);
        };
        let seen = null;
        const watch = () => {
          const t = document.getElementById("toast");
          if (!t || t === seen) return;
          seen = t;
          const zw = document.querySelector(".zwrap");
          if (zw && t.parentNode !== zw) zw.appendChild(t); // sits on the figure itself
          new MutationObserver(cap).observe(t, {
            childList: true,
            characterData: true,
            subtree: true,
          });
          cap();
        };
        watch();
        const st = document.querySelector(".stage");
        if (st) new MutationObserver(watch).observe(st, { childList: true });
      })();
    </script>
    <script>
      (() => {
        const fix = () => {
          const art = document.getElementById("art");
          if (!art) return;
          for (const el of art.querySelectorAll('[fill="#41538f" i]')) {
            let top = null,
              a = el.parentElement;
            while (a && a !== art) {
              const o = a.getAttribute("opacity");
              if (o !== null && +o < 1) top = a;
              a = a.parentElement;
            }
            if (top) top.parentNode.insertBefore(el, top);
          }
        };
        const go = () => {
          const art = document.getElementById("art");
          if (!art) return setTimeout(go, 50);
          fix();
          new MutationObserver(fix).observe(art, { childList: true });
        };
        if (document.readyState === "loading")
          addEventListener("DOMContentLoaded", go);
        else go();
      })();
    </script>
    <style>
      .lgd {
        display: none;
      }
      @media (max-width: 560px) {
        html:not(.nolabels) .lgd.has {
          display: grid;
        }
      }
      .lgd {
        grid-template-columns: 1fr 1fr;
        gap: 2px 8px;
        margin: 4px 0 12px;
        font:
          700 10.5px/1.25 ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.03em;
        color: #231e16;
      }
      .lgd button {
        all: unset;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        padding: 4px;
        border-radius: 7px;
        -webkit-tap-highlight-color: transparent;
      }
      .lgd b {
        flex: none;
        min-width: 17px;
        height: 17px;
        padding: 0 3px;
        box-sizing: border-box;
        border-radius: 999px;
        border: 1.2px solid #231e16;
        background: #fff4d6;
        text-align: center;
        font:
          800 10px/15px ui-monospace,
          Menlo,
          monospace;
      }
      .lgd .on b {
        background: var(--accent, #f4b829);
      }
      .lgd .sel {
        background: rgba(35, 30, 22, 0.09);
      }
      .lgd .sel b {
        background: #231e16;
        color: #fff4d6;
      }
    </style>
    <script>
      (() => {
        const fig = document.getElementById("fig");
        if (!fig) return;
        const lg = document.createElement("div");
        lg.className = "lgd";
        const at = document.querySelector(".zwrap") || fig;
        at.parentNode.insertBefore(lg, at.nextSibling);
        const hs = document.createElement("style");
        document.head.appendChild(hs);
        let sig = "",
          sel = 0,
          q = 0,
          names = "",
          num = new Map();
        // the figure's own numbers count every label it has ever drawn; here they are reset to 1, 2, 3... down the left
        // column then the right, each time the set of labels changes (so they hold still while the figure turns)
        const renum = () => {
          if (innerWidth > 560) return;
          const gs = [...fig.querySelectorAll(".tag[data-t]")];
          const key = gs
            .map((g) => g.dataset.t)
            .sort()
            .join("|");
          if (key !== names) {
            names = key;
            num = new Map();
            const vb = fig.viewBox.baseVal,
              cx = vb.x + vb.width / 2;
            const at = (g) => {
              const r = g.querySelector("rect");
              return r
                ? [
                    +r.getAttribute("x") + r.getAttribute("width") / 2,
                    +r.getAttribute("y"),
                  ]
                : [0, 0];
            };
            gs.map((g) => [g.dataset.t, ...at(g)])
              .sort((a, b) => (a[1] > cx) - (b[1] > cx) || a[2] - b[2])
              .forEach(([t]) => {
                if (!num.has(t)) num.set(t, num.size + 1);
              });
          }
          for (const g of gs) {
            const n = String(num.get(g.dataset.t));
            if (g.dataset.n !== n) {
              g.dataset.n = n;
              const t = g.querySelector("text");
              if (t) t.textContent = n;
            }
          }
        };
        const mark = () => {
          hs.textContent = sel
            ? `#fig .tag[data-n="${sel}"] rect{fill:#231e16!important}#fig .tag[data-n="${sel}"] text{fill:#fff4d6}#fig .tag[data-n="${sel}"] path{stroke-width:2.4}`
            : "";
          for (const x of lg.children)
            x.classList.toggle("sel", +x.dataset.n === sel);
        };
        const upd = () => {
          q = 0;
          const m = new Map();
          if (innerWidth <= 560)
            for (const g of fig.querySelectorAll(".tag[data-n]")) {
              const n = +g.dataset.n;
              if (!m.has(n))
                m.set(n, [g.dataset.t, g.classList.contains("on")]);
            }
          const a = [...m].sort((x, y) => x[0] - y[0]),
            s = JSON.stringify(a);
          if (s === sig) return;
          sig = s;
          lg.classList.toggle("has", a.length > 0);
          lg.innerHTML = a
            .map(
              ([n, [t, on]]) =>
                `<button data-n="${n}" class="${on ? "on" : ""}"><b>${n}</b><span>${t}</span></button>`,
            )
            .join("");
          mark();
        };
        lg.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          sel = sel === +b.dataset.n ? 0 : +b.dataset.n;
          mark();
        });
        new MutationObserver(() => {
          renum();
          if (!q) q = requestAnimationFrame(upd);
        }).observe(fig, { childList: true, subtree: true });
        renum();
        addEventListener("resize", () => {
          if (!q) q = requestAnimationFrame(upd);
        });
        upd();
      })();
    </script>
  </body>
