<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Unlisted demo: keep out of search results. Also sent as an X-Robots-Tag header (next.config.mjs). -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <style>
      html,
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      img {
        max-width: 100%;
      }
      :root {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
    <title>Bible Toolkit Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      /* Layout: a hub of tool tiles, then one narrow working column per tool with one step on screen at a time; header shapes double as the progress tracker. */
      :root {
        color-scheme: dark;
        --bg: #0e0e0f;
        --surface: #161617;
        --raise: #1d1d1f;
        --line: #262628;
        --fg: #c9c9c9;
        --fg-hi: #ececec;
        --muted: #7c7c7e;
        --btn-bg: #c9c9c9;
        --btn-fg: #0e0e0f;
        --on-chip: #0e0e0f;
        --good: #7fb08a;
        --warn: #d2a35c;
        --shape: #e4e4e4; /* every tool shape and interactive accent: monochrome, told apart by form */
        --scratch: #2a2a2c;
        --font: "Geist", "Helvetica Neue", Arial, sans-serif;
        --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          color-scheme: light;
          --bg: #f4f4f3;
          --surface: #ffffff;
          --raise: #ececea;
          --line: #dcdcd9;
          --fg: #3a3a3b;
          --fg-hi: #111112;
          --muted: #6e6e70;
          --btn-bg: #1a1a1b;
          --btn-fg: #f4f4f3;
          --on-chip: #ffffff;
          --good: #3f7d4f;
          --warn: #9a6a1e;
          --shape: #1a1a1b;
          --scratch: #cfcfcc;
        }
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f4f3;
        --surface: #ffffff;
        --raise: #ececea;
        --line: #dcdcd9;
        --fg: #3a3a3b;
        --fg-hi: #111112;
        --muted: #6e6e70;
        --btn-bg: #1a1a1b;
        --btn-fg: #f4f4f3;
        --on-chip: #ffffff;
        --good: #3f7d4f;
        --warn: #9a6a1e;
        --shape: #1a1a1b;
        --scratch: #cfcfcc;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 17px;
        line-height: 1.55;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--bg);
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      .wrap.wide {
        max-width: 1040px;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--fg-hi);
        outline-offset: 2px;
        border-radius: 4px;
      }
      h1:focus,
      h2:focus {
        outline: none;
      }

      /* Header */
      header.top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      header.top .wrap {
        display: flex;
        align-items: center;
        gap: 16px;
        padding-block: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--fg-hi);
        text-decoration: none;
        white-space: nowrap;
        min-width: 0;
      }
      .brand svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .brand span {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track {
        display: flex;
        gap: 6px;
        margin-left: auto;
        align-items: center;
      }
      .track button {
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        cursor: pointer;
        background: var(--c);
        opacity: 0.18;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .track button.done {
        opacity: 0.9;
      }
      .track button.now {
        opacity: 1;
        transform: scale(1.15);
      }
      .track button:disabled {
        cursor: default;
      }
      .counter {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        min-width: 72px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .track:empty + .counter {
        margin-left: auto;
      }

      /* Shapes */
      .sh {
        --c: var(--shape);
        background: var(--c);
      }
      /* One geometric shape per tool. Forms are built with clip-path and gradients so each stays a single element. */
      .shp-ring {
        border-radius: 50%;
        background: radial-gradient(circle, transparent 0 30%, var(--c) 31%);
      }
      .shp-frame {
        clip-path: polygon(
          evenodd,
          0 0,
          100% 0,
          100% 100%,
          0 100%,
          0 0,
          30% 30%,
          30% 70%,
          70% 70%,
          70% 30%,
          30% 30%
        );
      }
      .shp-bars {
        background: linear-gradient(
          var(--c) 0 26%,
          transparent 26% 37%,
          var(--c) 37% 63%,
          transparent 63% 74%,
          var(--c) 74%
        );
      }
      .shp-chevron {
        clip-path: polygon(0 0, 50% 0, 100% 50%, 50% 100%, 0 100%, 50% 50%);
      }
      .shp-pillars {
        background: linear-gradient(
          90deg,
          var(--c) 0 36%,
          transparent 36% 64%,
          var(--c) 64%
        );
      }
      .shp-quarter {
        border-radius: 100% 0 0 0;
      }
      .shp-square {
        border-radius: 0;
      }
      .shp-diamond {
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      }
      .shp-half {
        clip-path: circle(50% at 50% 100%);
      }
      .shp-dots {
        background:
          radial-gradient(circle at 25% 50%, var(--c) 0 23%, transparent 24%),
          radial-gradient(circle at 75% 50%, var(--c) 0 23%, transparent 24%);
      }
      .shp-slant {
        clip-path: polygon(32% 0, 100% 0, 68% 100%, 0 100%);
      }
      .shp-hex {
        clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0 50%);
      }
      .shp-bowtie {
        clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 50% 50%, 0 100%);
      }
      .shp-play {
        clip-path: polygon(8% 0, 100% 50%, 8% 100%);
      }
      .shp-circle {
        border-radius: 50%;
      }
      .shp-plus {
        clip-path: polygon(
          35% 0,
          65% 0,
          65% 35%,
          100% 35%,
          100% 65%,
          65% 65%,
          65% 100%,
          35% 100%,
          35% 65%,
          0 65%,
          0 35%,
          35% 35%
        );
      }

      /* Type */
      .eyebrow {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tag {
        font-family: var(--mono);
        font-size: 12px;
        padding: 3px 7px;
        border-radius: 4px;
        color: var(--c, var(--fg));
        background: color-mix(in srgb, var(--c, var(--fg)) 12%, transparent);
      }
      h1,
      h2 {
        font-weight: 400;
        color: var(--fg-hi);
        text-wrap: balance;
        margin: 0;
      }
      h1 {
        font-size: clamp(30px, 6vw, 44px);
        line-height: 1.1;
        letter-spacing: -0.025em;
      }
      h2 {
        font-size: clamp(24px, 4.6vw, 32px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      h1 em,
      h2 em,
      h3 em {
        font-style: normal;
        color: var(--muted);
      }
      .lede {
        font-size: 19px;
        color: var(--fg);
        max-width: 60ch;
        margin: 0;
      }
      .small {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }

      /* Views */
      main {
        padding-block: 40px 80px;
      }
      section.step {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .step-head {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .reveal-in {
        animation: rise 0.35s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes rise {
        from {
          transform: translateY(8px);
        }
        to {
          transform: none;
        }
      }

      /* Hub */
      .hero-shapes {
        display: grid;
        grid-template-columns: repeat(16, 1fr);
        gap: 8px;
        max-width: 100%;
      }
      .hero-shapes .sh {
        aspect-ratio: 1;
        max-width: 100%;
        animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes pop {
        from {
          transform: scale(0.85);
        }
        to {
          transform: none;
        }
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 8px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        min-height: 172px;
        border: 1px solid var(--line);
        border-radius: 4px;
        text-decoration: none;
        color: var(--fg);
        background: transparent;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      a.tile:hover {
        border-color: var(--muted);
        background: var(--surface);
      }
      .tile .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .tile .sh {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
      }
      .tile .num {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .tile b {
        font-weight: 500;
        color: var(--fg-hi);
        font-size: 18px;
        letter-spacing: -0.015em;
      }
      .tile p {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
        flex: 1;
      }
      .tile .status {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tile .status .bar {
        flex: 1;
        height: 2px;
        background: var(--line);
        position: relative;
      }
      .tile .status .bar i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--c);
      }
      .tile.soon {
        opacity: 0.5;
      }
      .tile.soon .sh {
        opacity: 0.4;
      }
      .hero-shapes .sh.dim {
        opacity: 0.28;
      }
      .hub-head {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .outline {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      .outline li {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .outline .sh {
        width: 18px;
        height: 18px;
      }
      .outline b {
        font-weight: 500;
        color: var(--fg-hi);
      }
      .outline .t {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font: 500 14px/1 var(--font);
        letter-spacing: -0.01em;
        padding: 14px 16px;
        border-radius: 4px;
        border: 1px solid transparent;
        cursor: pointer;
        background: var(--btn-bg);
        color: var(--btn-fg);
        text-decoration: none;
        transition:
          opacity 0.15s,
          transform 0.1s;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.25;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--fg);
        border-color: var(--line);
      }
      .btn.ghost:hover {
        border-color: var(--muted);
      }
      .btn.wide {
        flex: 1;
      }
      .btn .arr {
        font-size: 15px;
        line-height: 0;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .nav {
        display: flex;
        gap: 8px;
        border-top: 1px solid var(--line);
        padding-top: 24px;
      }

      .watch {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        align-self: flex-start;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        text-decoration: none;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .watch:hover {
        color: var(--fg-hi);
        border-color: var(--muted);
      }
      .watch .play {
        width: 0;
        height: 0;
        border-left: 7px solid currentColor;
        border-top: 4.5px solid transparent;
        border-bottom: 4.5px solid transparent;
      }

      /* Passages */
      .quote {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .quote p {
        margin: 0;
        font-size: 21px;
        line-height: 1.5;
        color: var(--fg-hi);
        letter-spacing: -0.015em;
      }
      .quote .ref {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .quote .note {
        font-size: 15px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .v {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        vertical-align: super;
        margin-right: 3px;
        letter-spacing: 0;
      }
      .echo {
        color: var(--muted) !important;
      }
      mark.key {
        background: color-mix(in srgb, var(--shape) 16%, transparent);
        box-shadow: inset 0 -2px 0 var(--fg-hi);
        color: var(--fg-hi);
        padding: 0 2px;
        border-radius: 2px;
      }
      mark.focus {
        background: color-mix(in srgb, var(--shape) 18%, transparent);
        color: var(--fg-hi);
        padding: 0 2px;
        border-radius: 2px;
      }

      /* Choices */
      .choices {
        display: grid;
        gap: 8px;
      }
      .choice {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 14px;
        align-items: start;
        text-align: left;
        font: inherit;
        color: var(--fg);
        background: transparent;
        cursor: pointer;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 4px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .choice:hover {
        border-color: var(--muted);
      }
      .choice .k {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        padding-top: 3px;
      }
      .choice b {
        display: block;
        font-weight: 500;
        color: var(--fg-hi);
      }
      .choice span.d {
        display: block;
        font-size: 15px;
        color: var(--muted);
      }
      .choice[aria-pressed="true"] {
        border-color: var(--fg-hi);
        background: color-mix(in srgb, var(--fg-hi) 8%, transparent);
      }
      .choice:disabled {
        cursor: default;
      }
      .choice:disabled:not([aria-pressed="true"]) {
        opacity: 0.5;
      }

      .feedback {
        border-left: 2px solid var(--fb, var(--muted));
        padding: 4px 0 4px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .feedback .verdict {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fb, var(--muted));
      }
      .feedback p {
        margin: 0;
        max-width: 62ch;
      }
      .feedback ol {
        margin: 4px 0 0;
        padding-left: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 62ch;
      }
      .feedback.good {
        --fb: var(--good);
      }
      .feedback.warn {
        --fb: var(--warn);
      }

      /* Scratch card */
      .scratch {
        position: relative;
        border-radius: 4px;
        overflow: hidden;
        touch-action: none;
      }
      .scratch canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
        transition: opacity 0.4s;
      }
      .scratch.clear canvas {
        opacity: 0;
        pointer-events: none;
      }
      .scratch:not(.clear) mark.key {
        background: transparent;
      }

      .flow {
        display: grid;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .flow > div {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 16px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        align-items: baseline;
      }
      .flow > div:last-child {
        border-bottom: 0;
      }
      .flow .lab {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .flow .val {
        color: var(--fg-hi);
        min-width: 0;
      }

      /* Drag and drop */
      .board {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: stretch;
      }
      .slot {
        min-height: 96px;
        border: 1px dashed var(--line);
        border-radius: 4px;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 12px;
        font: inherit;
        color: var(--muted);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .slot .lab {
        font-family: var(--mono);
        font-size: 12px;
      }
      .over,
      .armed {
        border-color: var(--fg) !important;
      }
      .filled-bad {
        border-style: solid !important;
        border-color: var(--warn) !important;
        background: color-mix(in srgb, var(--warn) 8%, transparent);
      }
      .filled-good {
        border-style: solid !important;
        border-color: var(--good) !important;
        background: color-mix(in srgb, var(--good) 8%, transparent);
      }
      .core {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 12px 18px;
        border-radius: 4px;
        background: var(--raise);
        color: var(--fg-hi);
        text-align: center;
      }
      .core b {
        font-weight: 500;
        font-size: 18px;
      }
      .core small {
        font-size: 12px;
        color: var(--muted);
      }
      .tray {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        min-height: 48px;
      }
      .chip {
        font: 500 15px/1 var(--font);
        padding: 12px 16px;
        border-radius: 4px;
        cursor: grab;
        border: 0;
        background: var(--shape);
        color: var(--on-chip);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .chip.picked {
        outline: 2px solid var(--fg-hi);
        outline-offset: 2px;
      }
      .chip.dragging {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        cursor: grabbing;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .gaptext p {
        line-height: 2.1;
      }
      .gap {
        font: inherit;
        display: inline-block;
        min-width: 92px;
        padding: 0 10px;
        margin: 0 2px;
        line-height: 1.5;
        border: 0;
        border-bottom: 2px dashed var(--muted);
        border-radius: 3px 3px 0 0;
        background: var(--raise);
        color: var(--muted);
        cursor: pointer;
        text-align: center;
        vertical-align: baseline;
      }
      .gap.filled {
        color: var(--fg-hi);
        border-bottom-style: solid;
        border-bottom-color: var(--shape);
        background: color-mix(in srgb, var(--shape) 18%, transparent);
      }
      .gap.bad {
        border-bottom-color: var(--warn);
        background: color-mix(in srgb, var(--warn) 22%, transparent);
      }
      .gap.ok {
        border-bottom-color: var(--good);
      }
      .gap.armed {
        border-bottom-color: var(--fg-hi);
      }

      /* Zoom */
      .rings {
        display: flex;
        gap: 0;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .rings span {
        flex: 1;
        text-align: center;
        padding: 10px 6px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        border-right: 1px solid var(--line);
      }
      .rings span:last-child {
        border-right: 0;
      }
      .rings span.on {
        color: var(--fg-hi);
        background: color-mix(in srgb, var(--shape) 12%, transparent);
      }
      .rings span.seen {
        color: var(--fg);
      }
      .zoomcard {
        transition: none;
      }
      .zoomcard.grow {
        animation: grow 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      @keyframes grow {
        from {
          transform: scale(0.985);
        }
        to {
          transform: none;
        }
      }

      /* Practice */
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tabs button {
        font: 500 13px/1 var(--font);
        padding: 10px 12px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
      }
      .tabs button[aria-selected="true"] {
        background: var(--raise);
        color: var(--fg-hi);
        border-color: var(--muted);
      }
      .tabs button .ok {
        color: var(--good);
        margin-left: 6px;
      }
      .chunks p {
        font-size: 20px;
        line-height: 1.7;
      }
      .chunk {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        padding: 1px 3px;
        margin: 0 -1px;
        border-radius: 3px;
        cursor: pointer;
        text-align: left;
        display: inline;
        box-shadow: inset 0 -1px 0 var(--line);
        transition: background 0.12s;
      }
      .chunk:hover {
        background: var(--raise);
      }
      .chunk[aria-pressed="true"] {
        background: color-mix(in srgb, var(--shape) 20%, transparent);
        box-shadow: inset 0 -2px 0 var(--fg-hi);
      }
      .chunk.miss {
        box-shadow: inset 0 -2px 0 var(--warn);
      }
      .chunk.wrong {
        background: color-mix(in srgb, var(--warn) 34%, transparent);
      }

      label.field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label.field > span {
        font-size: 14px;
        color: var(--muted);
      }
      textarea {
        font: inherit;
        font-size: 16px;
        color: var(--fg-hi);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 12px 14px;
        resize: vertical;
        min-height: 84px;
        width: 100%;
      }
      textarea:focus {
        outline: none;
        border-color: var(--muted);
      }
      .model {
        background: var(--raise);
        border-radius: 4px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .model p {
        margin: 0;
        color: var(--fg-hi);
      }
      .cols3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .cols2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .block {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      .block h3 {
        margin: 0;
        font-weight: 400;
        font-size: 20px;
        color: var(--fg-hi);
        letter-spacing: -0.015em;
      }

      /* Finish */
      .summary {
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      .summary .r {
        display: grid;
        grid-template-columns: 170px 1fr;
        gap: 16px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .summary .r:last-child {
        border-bottom: 0;
      }
      .summary .lab {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        padding-top: 3px;
      }
      .summary .val {
        color: var(--fg-hi);
        min-width: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .summary .val.empty {
        color: var(--muted);
      }
      .copyFallback {
        width: 100%;
        min-height: 160px;
        font-family: var(--mono);
        font-size: 13px;
      }

      footer {
        border-top: 1px solid var(--line);
      }
      footer .wrap {
        padding-block: 20px 32px;
        font-size: 13px;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      @media (max-width: 560px) {
        body {
          font-size: 16px;
        }
        .brand span {
          display: none;
        }
        .quote {
          padding: 18px;
        }
        .quote p {
          font-size: 19px;
        }
        .board {
          grid-template-columns: 1fr;
        }
        .core {
          padding: 10px;
        }
        .cols3,
        .cols2 {
          grid-template-columns: 1fr;
        }
        .flow > div,
        .summary .r {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        .hero-shapes {
          grid-template-columns: repeat(8, 1fr);
          gap: 6px;
        }
        .chunks p {
          font-size: 18px;
        }
        .rings span {
          font-size: 11px;
          padding: 9px 2px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

            window.scrollTo(0, 0);
            const hd = el.querySelector("h1,h2");
            if (hd) {
              hd.setAttribute("tabindex", "-1");
              hd.focus({ preventScroll: true });
            }
          }
        }

        // ---------- hub ----------
        function openHub() {
          curTool = null;
          onResize = null;
          view.classList.add("wide");
          $("#headWrap").classList.add("wide");
          $("#crumb").textContent = "";
          $("#track").innerHTML = "";
          $("#counter").textContent = `${CATALOG.length} tools`;

              `<div class="sh ${c[3]}${TOOLS[c[0]] ? "" : " dim"}" style="animation-delay:${i * 0.03}s"></div>`,
          ).join("");
          const tiles = CATALOG.map(([id, name, desc, shape], i) => {
            const n = String(i + 1).padStart(2, "0");

              return `<div class="tile soon" aria-disabled="true"><div class="top">${sh}<span class="num">${n}</span></div><b>${esc(name)}</b><p>${esc(desc)}</p><div class="status">Coming soon</div></div>`;
            const t = TOOLS[id],
              st = S.tools[id],
              total = t.steps.length;
            const done = st
              ? Object.keys(st.done).filter((k) => st.done[k]).length
              : 0;
            const label =
              done >= total
                ? "Complete"
                : done
                  ? `${done} / ${total} steps`
                  : `${total} steps · ${t.minutes} min`;
            return `<a class="tile" href="#${id}"><div class="top">${sh}<span class="num">${n}</span></div><b>${esc(name)}</b><p>${esc(desc)}</p><div class="status"><span>${label}</span><span class="bar"><i style="width:${Math.round((done / total) * 100)}%"></i></span></div></a>`;
          }).join("");

            h(`<section class="step">
      <div class="hero-shapes" aria-hidden="true">${shapes}</div>
      <div class="hub-head">
        <div class="eyebrow"><span class="tag">${live} of ${CATALOG.length} ready</span> Interactive Bible study tools</div>
        <h1>Sixteen questions to ask of any passage. <em>Pick a tool and work it through.</em></h1>
        <p class="lede">Each tool takes about ten minutes. You learn it on a worked example, then try it on passages of your own. Your progress is kept in this browser.</p>

        // ---------- tool shell ----------

          go(unlocked(s) ? s : 0);
        }

        const N = () => TOOLS[curTool].steps.length;
        function unlocked(n) {
          const st = TS(curTool);
          for (let k = 1; k < n; k++) if (!st.done[k]) return false;
          return n <= N() + 1;
        }
        function markDone(i, v = true) {
          const st = TS(curTool);

          refreshChrome();

        function refreshChrome() {

          $("#counter").textContent =
            n === 0

          $$("button", $("#track")).forEach((b, i) => {
            const k = i + 1;
            b.classList.toggle("now", k === n);
            b.classList.toggle("done", !!TS(curTool).done[k]);
            b.disabled = !unlocked(k);

          const next = $("#nextBtn");
          if (next) next.disabled = !unlocked(n + 1);

        function go(n) {
          if (!unlocked(n)) return;
          curStep = n;

          if (n === 0) el = renderIntro(t);

        function navBar(n, label) {

        // ---------- intro ----------
        function renderIntro(t) {

          const el = h(`<section class="step">

      <div class="nav"><button class="btn ghost" data-hub>All tools</button><button class="btn wide" id="nextBtn">${TS(curTool).done[1] ? "Continue" : "Start"} <span class="arr">›</span></button>${t.video ? `<a class="btn ghost" href="${t.video}" target="_blank" rel="noopener">Video</a>` : ""}</div>

          $("[data-hub]", el).addEventListener("click", () => {
            location.hash = "";

            body,

            btn.hidden = true;
            after.hidden = false;
            after.style.display = "flex";
            a.v = true;
            save();
            done(true);
          }
          function init() {
            if (a.v) {
              reveal();
              return;
            }
            const r = wrap.getBoundingClientRect();
            const key = Math.round(r.width) + "x" + Math.round(r.height);
            if (key === sized || !r.width) return;
            sized = key;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = r.width * dpr;
            canvas.height = r.height * dpr;
            ctx = canvas.getContext("2d");
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.globalCompositeOperation = "source-over";
            ctx.fillStyle = css("--scratch");
            ctx.fillRect(0, 0, r.width, r.height);
            ctx.strokeStyle = css("--line");
            ctx.lineWidth = 1;
            for (let x = -r.height; x < r.width; x += 7) {
              ctx.beginPath();
              ctx.moveTo(x, r.height);
              ctx.lineTo(x + r.height, 0);
              ctx.stroke();
            }
            ctx.fillStyle = css("--muted");
            ctx.font = `500 12px ${css("--mono")}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(st.label, r.width / 2, r.height / 2);
            ctx.globalCompositeOperation = "destination-out";
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.lineWidth = 44;
          }
          const pt = (e) => {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
          };
          function stroke(p) {
            ctx.beginPath();
            ctx.moveTo((last || p).x, (last || p).y);
            ctx.lineTo(p.x + 0.01, p.y);
            ctx.stroke();
            last = p;
            if (++moves % 12 === 0) {
              const d = ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height,
              ).data;
              let clear = 0,
                total = 0;
              for (let i = 3; i < d.length; i += 96) {
                total++;
                if (d[i] < 40) clear++;
              }
              if (clear / total > 0.45) reveal();
            }
          }
          canvas.addEventListener("pointerdown", (e) => {
            if (!ctx) return;
            drawing = true;
            last = null;
            canvas.setPointerCapture(e.pointerId);
            stroke(pt(e));
          });
          canvas.addEventListener("pointermove", (e) => {
            if (drawing) stroke(pt(e));
          });
          ["pointerup", "pointercancel"].forEach((ev) =>
            canvas.addEventListener(ev, () => {
              drawing = false;
              last = null;
            }),
          );
          btn.addEventListener("click", reveal);
          el._after = () => requestAnimationFrame(init);
          onResize = () => {
            if (!a.v) {
              sized = "";
              init();
            }
          };
          body.append(wrap, btn, after);
        }

        /* shared drag-or-tap */
        function dnd(getTargets, onDrop) {
          let picked = null;
          const arm = (on) =>
            getTargets().forEach((t) => t.classList.toggle("armed", on));
          const clearPick = () => {
            picked = null;
            $$(".chip.picked").forEach((c) => c.classList.remove("picked"));
            arm(false);
          };
          function bind(chip, payload) {
            let start = null,
              moved = false,
              off = null;
            chip.addEventListener("pointerdown", (e) => {
              start = { x: e.clientX, y: e.clientY };
              moved = false;
              const r = chip.getBoundingClientRect();
              off = { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width };
              chip.setPointerCapture(e.pointerId);
            });
            chip.addEventListener("pointermove", (e) => {
              if (!start) return;
              if (
                !moved &&
                Math.hypot(e.clientX - start.x, e.clientY - start.y) < 6
              )
                return;
              if (!moved) {
                moved = true;
                chip.classList.add("dragging");
                chip.style.width = off.w + "px";
              }
              chip.style.left = e.clientX - off.x + "px";
              chip.style.top = e.clientY - off.y + "px";
              const under = document.elementFromPoint(e.clientX, e.clientY);
              getTargets().forEach((t) =>
                t.classList.toggle("over", !!under && t.contains(under)),
              );
            });
            const end = (e) => {
              if (!start) return;
              start = null;
              if (!moved) return;
              chip.classList.remove("dragging");
              chip.style.left = chip.style.top = chip.style.width = "";
              const under =
                e.type === "pointerup"
                  ? document.elementFromPoint(e.clientX, e.clientY)
                  : null;
              const t = getTargets().find((x) => under && x.contains(under));
              getTargets().forEach((x) => x.classList.remove("over"));
              clearPick();
              if (t) onDrop(t, payload);
            };
            chip.addEventListener("pointerup", end);
            chip.addEventListener("pointercancel", end);
            chip.addEventListener("click", (e) => {
              e.stopPropagation();
              if (moved) {
                moved = false;
                return;
              }
              const same = picked === payload;
              clearPick();
              if (!same) {
                picked = payload;
                chip.classList.add("picked");
                arm(true);
              }
            });
          }
          return {
            bind,
            take: () => {
              const p = picked;
              clearPick();
              return p;
            },
            has: () => picked !== null,
          };
        }

        /* slots */
        function slots(st, a, body, done) {
          const tray = h(`<div class="tray"></div>`);
          const chip = h(
            `<button class="chip" aria-label="${esc(st.chip)}. Pick up, then choose a slot.">${esc(st.chip)}</button>`,
          );
          const board = h(`<div class="board">
      <button class="slot" data-slot="${st.slots[0][0]}" aria-label="${st.slots[0][1]}"><span class="lab">${st.slots[0][1]}</span><span class="ph">Drop here</span></button>
      <div class="core"><b>${st.core[0]}</b><small>${st.core[1]}</small></div>
      <button class="slot" data-slot="${st.slots[1][0]}" aria-label="${st.slots[1][1]}"><span class="lab">${st.slots[1][1]}</span><span class="ph">Drop here</span></button>
    </div>`);
          const fb = h(`<div class="feedback" hidden></div>`);
          const targets = () => $$(".slot", board);
          function place(where) {
            a.v = where;
            save();
            targets().forEach((s) => {
              s.classList.remove("filled-good", "filled-bad", "armed", "over");
              const ph = $(".ph", s);
              if (s.dataset.slot === where) {
                ph.hidden = true;
                s.appendChild(chip);
                s.classList.add(
                  where === st.correct ? "filled-good" : "filled-bad",
                );
              } else ph.hidden = false;
            });
            setFb(fb, st.feedback[where]);
            done(where === st.correct);
          }
          const d = dnd(targets, (t) => place(t.dataset.slot));
          d.bind(chip, "chip");
          targets().forEach((s) =>
            s.addEventListener("click", () => {
              d.take();
              place(s.dataset.slot);
            }),
          );
          tray.appendChild(chip);
          body.append(tray, board, fb);
          if (a.v) place(a.v);
        }

        /* gaps */
        function gaps(st, a, body, done) {
          a.fill ||= st.answers.map(() => null);
          const card = h(
            `<div class="quote gaptext"><p></p>${st.ref ? `<span class="ref">${esc(st.ref)}</span>` : ""}</div>`,
          );
          const p = $("p", card);
          p.innerHTML = st.text.replace(
            /\[\[(\d+)\]\]/g,
            (_, g) =>
              `<button class="gap" data-g="${g}" aria-label="Gap ${+g + 1}, empty">&nbsp;</button>`,
          );
          const bank = h(`<div class="tray" aria-label="Word bank"></div>`);
          const row = h(
            `<div class="row"><button class="btn">Check</button><button class="btn ghost">Clear</button></div>`,
          );
          const [checkBtn, clearBtn] = $$("button", row);
          const fb = h(`<div class="feedback" hidden></div>`);
          const gapEls = () => $$(".gap", p);
          const d = dnd(gapEls, (t, bi) => put(+t.dataset.g, bi));
          function put(g, bi) {
            a.fill = a.fill.map((x) => (x === bi ? null : x));
            a.fill[g] = bi;
            a.checked = false;
            save();
            paint();
          }
          function paint() {
            gapEls().forEach((gEl) => {
              const bi = a.fill[+gEl.dataset.g];
              gEl.classList.remove("ok", "bad");
              gEl.classList.toggle("filled", bi !== null);
              gEl.textContent = bi !== null ? st.bank[bi] : " ";
              gEl.setAttribute(
                "aria-label",
                `Gap ${+gEl.dataset.g + 1}, ${bi !== null ? st.bank[bi] : "empty"}`,
              );
            });
            bank.innerHTML = "";
            st.bank.forEach((w, bi) => {
              if (a.fill.includes(bi)) return;
              const c = h(`<button class="chip">${esc(w)}</button>`);
              d.bind(c, bi);
              bank.appendChild(c);
            });
            if (!bank.children.length)
              bank.appendChild(
                h(
                  `<span class="small" style="align-self:center">All words placed</span>`,
                ),
              );
            if (a.checked) mark(false);
          }
          gapEls().forEach((gEl) =>
            gEl.addEventListener("click", () => {
              const g = +gEl.dataset.g;
              if (d.has()) put(g, d.take());
              else if (a.fill[g] !== null) {
                a.fill[g] = null;
                a.checked = false;
                save();
                paint();
                fb.hidden = true;
              }
            }),
          );
          function mark(announce = true) {
            if (a.fill.some((x) => x === null)) {
              setFb(fb, ["warn", "Not finished", "Fill every gap first."]);
              return;
            }
            const wrong = a.fill.map((bi, g) => st.bank[bi] !== st.answers[g]);
            gapEls().forEach((gEl) => {
              const g = +gEl.dataset.g;
              gEl.classList.toggle("bad", wrong[g]);
              gEl.classList.toggle("ok", !wrong[g]);
            });
            const nWrong = wrong.filter(Boolean).length;
            if (!nWrong) {
              fb.className = "feedback good";
              fb.hidden = false;
              fb.innerHTML = `<span class="verdict">All correct</span><p>${st.good}</p><ol>${st.explain.map((x) => `<li>${x}</li>`).join("")}</ol>`;
              a.checked = true;
              save();
              done(true);
            } else {
              setFb(fb, [
                "warn",
                "Look again",
                `${nWrong === 1 ? "One gap isn't" : nWrong + " gaps aren't"} right yet, marked in amber. Tap a gap to empty it and try another word.`,
              ]);
            }
          }
          checkBtn.addEventListener("click", () => mark());
          clearBtn.addEventListener("click", () => {
            a.fill = st.answers.map(() => null);
            a.checked = false;
            save();
            fb.hidden = true;
            paint();
          });
          paint();
          body.append(bank, card, row, fb);
        }

        /* zoom */
        function zoom(st, a, body, done) {
          a.level ||= 0;
          const rings = h(
            `<div class="rings" aria-hidden="true">${st.rings.map((r) => `<span>${r}</span>`).join("")}</div>`,
          );
          const holder = h(`<div></div>`);
          const group = h(
            `<div class="choices">${st.options.map(([v, b, d], i) => `<button class="choice" data-v="${v}" aria-pressed="${a.v === v}"><span class="k">${"ABC"[i]}</span><span><b>${b}</b><span class="d">${d}</span></span></button>`).join("")}</div>`,
          );
          const zbtn = h(
            `<button class="btn" style="align-self:flex-start">Zoom out <span class="arr">›</span></button>`,
          );
          const fb = h(`<div class="feedback" hidden></div>`);
          const hint = h(
            `<p class="small">Make a guess first, then zoom out.</p>`,
          );
          function paint(animate) {
            const L = st.layers[a.level];
            holder.innerHTML = passageBlock(
              L,
              "zoomcard" + (animate ? " grow" : ""),
            );
            $$("span", rings).forEach((s, i) => {
              s.classList.toggle("on", i === a.level);
              s.classList.toggle("seen", i < a.level);
            });
            $$(".choice", group).forEach((c) => {
              c.setAttribute("aria-pressed", String(c.dataset.v === a.v));
              c.disabled = !!a.v;
            });
            const last = a.level >= st.layers.length - 1;
            zbtn.hidden = last;
            zbtn.disabled = !a.v;
            hint.hidden = !!a.v;
            if (last && a.v) {
              const ok = st.correct
                ? a.v === st.correct || a.v === "cant"
                : a.v !== "loved";
              const label = !st.correct
                ? "Here's the full review"
                : ok
                  ? "Context confirms it"
                  : "Context changes it";
              fb.className = "feedback " + (ok ? "good" : "warn");
              fb.hidden = false;
              fb.innerHTML = `<span class="verdict">${label}</span><p>${st.verdict[a.v]}</p><p style="color:var(--muted)">${st.takeaway}</p>`;
              done(true);
            } else fb.hidden = true;
          }
          group.addEventListener("click", (e) => {
            const c = e.target.closest(".choice");
            if (!c || a.v) return;
            a.v = c.dataset.v;
            save();
            paint();
          });
          zbtn.addEventListener("click", () => {
            a.level = Math.min(a.level + 1, st.layers.length - 1);
            save();
            paint(true);
          });
          paint();
          body.append(rings, holder, group, hint, zbtn, fb);
        }

        /* highlight */
        function highlight(st, a, body, done) {
          a.cur ||= st.passages[0].id;
          a.sel ||= {};
          a.checked ||= {};
          a.why ||= {};
          a.model ||= {};
          const tabs = h(`<div class="tabs" role="tablist"></div>`);
          const card = h(`<div class="quote chunks"></div>`);
          const row = h(
            `<div class="row"><button class="btn">Check my highlights</button><button class="btn ghost">Clear</button></div>`,
          );
          const [checkBtn, clearBtn] = $$("button", row);
          const fb = h(`<div class="feedback" hidden></div>`);
          const wb = h(
            `<div class="block"><h3></h3><label class="field"><span></span><textarea rows="3"></textarea></label><button class="btn ghost" style="align-self:flex-start">Compare with ours</button><div class="model" hidden><div class="eyebrow">One way to put it</div><p></p></div></div>`,
          );
          const why = $("textarea", wb),
            modelBox = $(".model", wb);
          const cur = () =>
            st.passages.find((p) => p.id === a.cur) || st.passages[0];
          function paintTabs() {
            tabs.innerHTML = st.passages
              .map(
                (p) =>
                  `<button role="tab" data-id="${p.id}" aria-selected="${p.id === a.cur}">${p.label}${a.checked[p.id] ? '<span class="ok">✓</span>' : ""}</button>`,
              )
              .join("");
          }
          function render() {
            const p = cur(),
              sel = a.sel[p.id] || [];
            paintTabs();
            card.innerHTML = `<p>${p.chunks.map((c, i) => `<button class="chunk" data-i="${i}" aria-pressed="${sel.includes(i)}">${c}</button>`).join(" ")}</p><span class="ref">${p.ref}</span>`;
            fb.hidden = true;
            $("h3", wb).textContent = fill(st.write.prompt, p);
            $("label span", wb).textContent = fill(st.write.label, p);
            why.placeholder = st.write.placeholder;
            why.value = a.why[p.id] || "";
            modelBox.hidden = !a.model[p.id];
            $("p", modelBox).textContent = p.model;
            if (a.checked[p.id]) check();
          }
          tabs.addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            a.cur = b.dataset.id;
            save();
            render();
          });
          card.addEventListener("click", (e) => {
            const c = e.target.closest(".chunk");
            if (!c) return;
            const p = cur(),
              i = +c.dataset.i,
              sel = new Set(a.sel[p.id] || []);
            sel.has(i) ? sel.delete(i) : sel.add(i);
            a.sel[p.id] = [...sel];
            save();
            c.setAttribute("aria-pressed", String(sel.has(i)));
            $$(".chunk", card).forEach((x) =>
              x.classList.remove("miss", "wrong"),
            );
          });
          function check() {
            const p = cur(),
              sel = new Set(a.sel[p.id] || []);
            const missed = p.keys.filter((k) => !sel.has(k)),
              extra = [...sel].filter((k) => !p.keys.includes(k));
            $$(".chunk", card).forEach((x) => {
              const i = +x.dataset.i;
              x.classList.toggle("miss", missed.includes(i));
              x.classList.toggle("wrong", extra.includes(i));
            });
            if (!sel.size) {
              setFb(fb, [
                "warn",
                "Nothing picked yet",
                "Tap the phrases you think are the clues.",
              ]);
              return;
            }
            if (!missed.length) {
              const note = extra.length
                ? " The amber phrases are part of the passage's content rather than the clue you're looking for."
                : "";
              setFb(fb, ["good", "You found it", fill(st.success, p) + note]);
              if (!a.checked[p.id]) {
                a.checked[p.id] = true;
                save();
                paintTabs();
              }
              done(true);
            } else {
              setFb(fb, [
                "warn",
                "Look again",
                `You've missed ${missed.length === 1 ? "a phrase" : "some phrases"}, underlined in amber. ${fill(st.missHint, p)}`,
              ]);
            }
          }
          checkBtn.addEventListener("click", check);
          clearBtn.addEventListener("click", () => {
            a.sel[cur().id] = [];
            save();
            render();
          });
          why.addEventListener("input", () => {
            a.why[cur().id] = why.value;
            save();
          });
          $(".btn", wb).addEventListener("click", () => {
            a.model[cur().id] = true;
            save();
            modelBox.hidden = false;
          });
          render();
          body.append(tabs, card, row, fb, wb);
          if (st.sowhat) body.appendChild(soWhat(a));
        }

        function soWhat(a) {
          a.sw ||= {};
          const el =
            h(`<div class="block"><h3>So what? <em>If that's what it means, what follows for…</em></h3><div class="cols3">
      ${[
        ["me", "Me"],
        ["church", "My church"],
        ["world", "An unbeliever"],
      ]
        .map(
          ([k, l]) =>
            `<label class="field"><span>${l}</span><textarea rows="4" data-k="${k}"></textarea></label>`,
        )
        .join("")}
    </div></div>`);
          $$("textarea", el).forEach((t) => {
            t.value = a.sw[t.dataset.k] || "";
            t.addEventListener("input", () => {
              a.sw[t.dataset.k] = t.value;
              save();
            });
          });
          return el;
        }

        /* reflect */
        function reflect(st, a, body, done) {
          a.f ||= {};
          const el = h(
            `<div style="display:flex;flex-direction:column;gap:16px">${st.fields.map(([k, l, r]) => `<label class="field"><span>${l}</span><textarea rows="${r}" data-k="${k}"></textarea></label>`).join("")}</div>`,
          );
          $$("textarea", el).forEach((t) => {
            t.value = a.f[t.dataset.k] || "";
            t.addEventListener("input", () => {
              a.f[t.dataset.k] = t.value;
              save();
            });
          });
          body.appendChild(el);
          if (st.sowhat) body.appendChild(soWhat(a));
          done(true);
        }

        // ---------- finish ----------
        function notes(t) {
          const rows = [
            ["Tool", toolMeta(curTool)[1] + ": " + t.headline.join(" ")],
          ];
          t.finish.takeaways.forEach((r) => rows.push(r));
          t.steps.forEach((st, k) => {
            const a = TS(curTool).a[k + 1] || {};
            if (st.type === "highlight")
              st.passages.forEach((p) => {
                const v = (a.why || {})[p.id];
                if (v && v.trim()) rows.push([p.label, v.trim()]);
              });
            if (st.type === "reflect")
              st.fields.forEach(([key, label]) => {
                const v = (a.f || {})[key];
                if (v && v.trim())
                  rows.push([label.replace(/\?$/, ""), v.trim()]);
              });
            if (st.sowhat)
              [
                ["me", "So what · me"],
                ["church", "So what · church"],
                ["world", "So what · unbeliever"],
              ].forEach(([key, label]) =>
                rows.push([label, ((a.sw || {})[key] || "").trim()]),
              );
          });
          return rows;
        }
        function renderFinish(t) {
          const rows = notes(t);
          const others = CATALOG.filter((c) => TOOLS[c[0]] && c[0] !== curTool);
          const el = h(`<section class="step">
      <div class="step-head">
        <div class="eyebrow"><span class="tag" >Done</span> ${esc(toolMeta(curTool)[1])}</div>
        <h2>${t.finish.title[0]} <em>${t.finish.title[1]}</em></h2>
        <p class="lede">${t.finish.lede}</p>
      </div>
      <div class="summary">${rows.map(([l, v]) => `<div class="r"><span class="lab">${esc(l)}</span><span class="val${v ? "" : " empty"}">${v ? esc(v) : "Not filled in"}</span></div>`).join("")}</div>
      <div class="row"><button class="btn" data-copy>Copy my notes</button><button class="btn ghost" data-restart>Start this tool again</button></div>
      <textarea class="copyFallback" readonly hidden aria-label="Your notes as text"></textarea>
      <div class="block"><h3>Next tool</h3><div class="row">${others.map((c) => `<a class="btn ghost" href="#${c[0]}">${esc(c[1])} <span class="arr">›</span></a>`).join("")}<a class="btn ghost" href="#">All tools</a></div></div>
    </section>`);
          const copyBtn = $("[data-copy]", el);
          copyBtn.addEventListener("click", () => {
            const text = rows.map(([l, v]) => `${l}: ${v || "-"}`).join("\n");
            const fallback = () => {
              const ta = $(".copyFallback", el);
              ta.value = text;
              ta.hidden = false;
              ta.focus();
              ta.select();
              copyBtn.textContent = "Select and copy below";
            };
            try {
              navigator.clipboard.writeText(text).then(() => {
                copyBtn.textContent = "Copied";
                setTimeout(() => (copyBtn.textContent = "Copy my notes"), 1800);
              }, fallback);
            } catch (e) {
              fallback();
            }
          });
          $("[data-restart]", el).addEventListener("click", () => {
            delete S.tools[curTool];
            save();
            go(0);
          });
          return el;
        }

        window.addEventListener("resize", () => onResize && onResize());
        route();
      })();
    </script>
  </body>
</html>
